name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proto:
    name: codegen is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: scripts/codegen.sh
      - name: fail if generated types drifted
        run: |
          if ! git diff --exit-code -- \
            miaotty/cli/crates/mtp/src/types.rs \
            miaotty/macos/MiaottyKit/Sources/MiaottyKit/MTP/Types.swift \
            miaotty/plugin/src/protocol.ts; then
            echo "::error::generated MTP types are stale — run scripts/codegen.sh"
            exit 1
          fi

  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miaotty/cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  swift:
    name: swift
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path miaotty/macos/MiaottyKit
      - run: swift test --package-path miaotty/macos/MiaottyKit

  plugin:
    name: miao plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miaotty/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
