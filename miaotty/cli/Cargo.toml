[workspace]
resolver = "2"
members = ["crates/mtp", "crates/miaotty-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/oxdingzg/miaotty"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
mtp = { path = "crates/mtp" }
